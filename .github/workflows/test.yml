name: Test converter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Python 3.9 is unavailable on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  ios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Verify committed bundle is reproducible
        run: git diff --exit-code -- module/surge-vless.js
      - run: npm audit --omit=dev
